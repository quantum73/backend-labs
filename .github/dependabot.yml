version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule: { interval: "weekly" }
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7          # для обновлений, где semver не определён
      semver-major-days: 14    # мажорные идут отдельными PR и самые рискованные
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      minor-and-patch: { update-types: [ "minor", "patch" ] }
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
