name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read                      # минимальные права по умолчанию

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true            # новый push отменяет устаревший прогон

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 — закреплять по SHA
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2 — закреплять по SHA
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen ruff check --output-format=github   # аннотации прямо в diff PR
      - run: uv run --frozen mypy libs/*/src labs/*/src
      - run: uv run --frozen pytest
