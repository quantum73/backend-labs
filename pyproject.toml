[tool.uv.workspace]
members = ["libs/*", "labs/*"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-randomly>=5.0.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py314"   # в виртуальном корне нет requires-python, поэтому указываем явно

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes: неиспользуемое, неопределённое
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade: современный синтаксис
    "B",         # bugbear: реальные баги (изменяемые дефолты и т.п.)
    "C4",        # comprehensions
    "SIM",       # упрощения
    "RUF",       # правила самого ruff
    "ASYNC",     # блокирующие вызовы в async-коде
    "S",         # bandit: безопасность
    "PT",        # стиль pytest
    "DTZ",       # datetime без таймзоны
    "T20",       # забытые print()
    "LOG", "G",  # логирование: f-строки в логах и т.п.
    "PERF",      # антипаттерны производительности
    "PL",        # pylint (подмножество)
    "TRY",       # обработка исключений
    "ARG",       # неиспользуемые аргументы
    "ERA",       # закомментированный код
    "PGH",       # pygrep: голый noqa / type: ignore без кода
]
ignore = [
    "TRY003",    # длинные сообщения в исключениях — допустимо
    "PLR0913",   # число аргументов — решаем на ревью
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "ARG"]   # assert, «магические» числа, фикстуры
"labs/02-aggregator/src/aggregator_app/legacy.py" = ["ALL"] # эталон "как было", не линтим

[tool.ruff.lint.isort]
known-first-party = ["labkit", "foundation_app", "aggregator_app"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["override"]

[tool.pyright]
venvPath = "."     # без этого pyright ищет пакеты в системном Python и не видит workspace
venv = ".venv"
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["libs", "labs"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]   # DeprecationWarning из зависимостей видны сразу, а не после апгрейда
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
