[project]
name = "aggregator-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "labkit",
    "pydantic>=2.11",
    "structlog>=25.4",
]

[project.scripts]
aggregator = "aggregator_app.cli:main"
aggregator-legacy = "aggregator_app.cli_legacy:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
labkit = { workspace = true }
