[project]
name = "foundation-app"
version = "0.1.0"
authors = [
    { name = "Nikita Fomin", email = "fominquant@yandex.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "labkit",
]

[project.scripts]
foundation = "foundation_app.main:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
labkit = { workspace = true }
