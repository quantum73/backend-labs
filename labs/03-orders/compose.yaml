# Локальный PostgreSQL для разработки (порт 5433, чтобы не конфликтовать с другими контейнерами)
#   docker compose -f labs/03-orders/compose.yaml up -d
#   export ORDERS_TEST_DATABASE_URL=postgresql+asyncpg://orders:orders@localhost:5433/orders
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U orders -d orders" ]
      interval: 2s
      timeout: 2s
      retries: 15
