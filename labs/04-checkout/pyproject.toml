[project]
name = "checkout-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32",
    "httpx>=0.28",
    "labkit",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
labkit = { workspace = true }
