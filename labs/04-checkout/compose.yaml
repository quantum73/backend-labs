# Локальный PostgreSQL для разработки и быстрых прогонов тестов (порт 5434: 5433 занят лабой 3)
#   docker compose -f labs/04-checkout/compose.yaml up -d
#   export CHECKOUT_TEST_DATABASE_URL=postgresql+asyncpg://checkout:checkout@localhost:5434/checkout
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
      POSTGRES_DB: checkout
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkout -d checkout"]
      interval: 2s
      timeout: 2s
      retries: 15
